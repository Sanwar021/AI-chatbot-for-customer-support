version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: supportpilot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: supportpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supportpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportpilot-backend
    restart: always
    environment:
      APP_NAME: SupportPilot
      APP_ENV: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/supportpilot
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: mock
      SECRET_KEY: change-me-in-production-supportpilot-master-key-2026
      ENCRYPTION_KEY: dGhpc2lzYTMydGVzdGtleTEyMzQ1Njc4OTAxMjM0NTY=
      PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: supportpilot-dashboard
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: supportpilot-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - dashboard

volumes:
  postgres_data:
  redis_data:
  uploads_data:
